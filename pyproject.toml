[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-validating-analytics-agent"
version = "0.1.0"
description = "A Self-Validating Autonomous Data Analytics Agent for Diagnostic and Evidence-Based Decision Support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Atul Sharma" }
]
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=1.0.0",
    "numpy>=1.24.0",
    "sqlglot>=23.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

